<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABI Musculoskeletal Modelling - MMG Outreach Hub</title>
    <!-- Vue 3 Global Build (vendored locally so the hub works offline) -->
    <script src="/resources/vendor/vue.global.prod.js"></script>
    <!-- Tailwind CSS Play CDN (vendored locally so the hub works offline) -->
    <script src="/resources/vendor/tailwindcss.js"></script>
    <!-- Material Design 3 foundation (Inter + UoA brand tokens + components) -->
    <link rel="stylesheet" href="/resources/vendor/material.css">
    <style>
        [v-cloak] { display: none; }

        body {
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            touch-action: manipulation;
        }

        /* Brand helper names kept, repointed to Material Design 3 tokens so the
           existing markup renders with the Material palette/shape/type. */
        .bg-uoa-navy   { background-color: var(--md-sys-color-primary); }
        .text-uoa-navy { color: var(--md-sys-color-primary); }
        .border-uoa-navy { border-color: var(--md-sys-color-primary); }
        .bg-uoa-gold   { background-color: var(--md-sys-color-tertiary-container); }
        /* Māhina bright cyan — the accent is only ever used on dark surfaces */
        .text-uoa-gold { color: var(--md-uoa-mahina); }
        .border-uoa-gold { border-color: var(--md-sys-color-primary); }
        .text-uoa-grey { color: var(--md-sys-color-on-surface-variant); }
        .hover-uoa-navy:active, .hover-uoa-navy:hover { filter: brightness(1.08); }

        /* App card = Material elevated card with a press/hover state layer */
        .app-card {
            position: relative;
            background: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
            border-radius: var(--md-shape-lg);
            box-shadow: var(--md-elevation-1);
            transition: box-shadow .2s ease, transform .2s ease;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .app-card::after {
            content: ''; position: absolute; inset: 0; background: var(--md-sys-color-primary);
            opacity: 0; transition: opacity .15s ease; pointer-events: none;
        }
        @media (hover: hover) {
            .app-card:hover { box-shadow: var(--md-elevation-3); transform: translateY(-2px); }
            .app-card:hover::after { opacity: .05; }
        }
        .app-card:active::after { opacity: .10; }

        .hero-gradient {
            /* UoA Waitematā deep blue → Azure, matching the brand slides */
            background: linear-gradient(135deg, #0c0c48 0%, #1f2bd4 100%);
            color: #ffffff;
            border-radius: var(--md-shape-xl);
        }

        /* Cross-fading hero figures (stacked; the active one fades in) */
        .hero-fig {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: 50% 0%;
            opacity: 0; transition: opacity 1s ease;
        }
        .hero-fig.is-active { opacity: 1; }

        @keyframes progress-loading { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
        .animate-progress { animation: progress-loading 2s ease-in-out infinite; }

        .scanline {
            height: 2px; background: rgba(0, 97, 164, 0.25); position: absolute;
            width: 100%; top: 0; z-index: 5; animation: scan 4s linear infinite;
        }
        @keyframes scan { from { top: 0%; } to { top: 100%; } }

        .wave-bar {
            background-color: var(--md-sys-color-primary); width: 4px; margin: 0 2px;
            border-radius: 2px; animation: wave-pulse 1s ease-in-out infinite;
        }
        @keyframes wave-pulse { 0%, 100% { height: 10px; } 50% { height: 40px; } }

        .touch-target { min-height: 44px; min-width: 44px; }

        /* Visible keyboard focus ring (only for keyboard users, not mouse).
           Navy on light surfaces; bright Māhina cyan on the dark nav bar. */
        :focus-visible { outline: 3px solid var(--md-sys-color-primary); outline-offset: 2px; }
        .app-card:focus-visible { box-shadow: var(--md-elevation-3); }
        nav :focus-visible { outline-color: var(--md-uoa-mahina); }

        /* Respect users who prefer reduced motion (vestibular safety) */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Visually hidden, still available to screen readers */
        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-x-hidden">
    <div id="app" v-cloak>
        
        <!-- DASHBOARD VIEW -->
        <template v-if="!activeApp">
            <!-- Top Branding Bar (Māhina cyan accent) -->
            <div class="h-1.5 w-full" style="background: var(--md-uoa-mahina)"></div>
            
            <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-28 sm:h-32 flex items-center justify-between gap-4">
                    <div class="flex items-center space-x-4 lg:space-x-6">
                        <!-- UoA / ABI Logo Area -->
                        <div class="border-r-2 border-uoa-gold pr-4 lg:pr-6">
                             <img src="/resources/ABI_logo_blue.png" alt="Auckland Bioengineering Institute"
                                  class="h-20 sm:h-24 w-auto" />
                        </div>
                        <h1 class="text-sm sm:text-xl font-bold text-uoa-navy uppercase tracking-tight hidden sm:block">MMG Outreach Demos</h1>
                    </div>
                    
                    <div class="relative flex-grow max-w-xs">
                        <label for="demo-search" class="sr-only">Search demos</label>
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input
                            id="demo-search"
                            v-model="searchQuery"
                            type="text"
                            placeholder="Search..."
                            aria-label="Search demos"
                            class="block w-full pl-9 pr-4 py-2.5 border-2 border-slate-100 rounded-md bg-slate-50 text-sm focus:border-uoa-navy focus:bg-white transition-all shadow-inner touch-target"
                        />
                    </div>
                </div>
            </header>

            <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
                <!-- Hero Section -->
                <div class="mb-8 sm:mb-12 relative overflow-hidden hero-gradient rounded-lg p-8 sm:p-16 shadow-2xl text-white">
                    <div class="relative z-10 max-w-2xl">
                        <div class="inline-block px-3 py-1 bg-uoa-gold text-uoa-navy text-[10px] font-bold uppercase tracking-widest mb-4 sm:mb-6">
                            ABI Musculoskeletal Modelling Group
                        </div>
                        <h2 class="text-3xl sm:text-5xl font-black mb-4 tracking-tight leading-tight">
                            Interactive <br><span class="text-uoa-gold">Biomechanics</span>
                        </h2>
                        <p class="text-base sm:text-lg text-blue-100 opacity-90 leading-relaxed max-w-xl">
                            Select a demo below to see how we model and analyse the musculoskeletal system.
                        </p>
                    </div>
                    <!-- Hero figures — cross-fade through a few outreach images -->
                    <div class="hero-figs absolute right-4 xl:right-10 bottom-0 w-96 xl:w-[32rem] pointer-events-none select-none hidden lg:block"
                         style="aspect-ratio: 3 / 2; overflow: hidden;">
                        <img v-for="(img, i) in heroImages" :key="img" :src="img"
                             alt="Musculoskeletal outreach figures" aria-hidden="true"
                             class="hero-fig" :class="{ 'is-active': i === heroIndex }" />
                    </div>
                </div>

                <!-- Category filter chips -->
                <div role="group" aria-label="Filter demos by category"
                     class="flex overflow-x-auto pb-4 mb-8 -mx-4 px-4 sm:mx-0 sm:px-0 sm:flex-wrap items-center gap-2 no-scrollbar">
                    <button
                        v-for="cat in categories"
                        :key="cat"
                        @click="selectedCategory = cat"
                        :aria-pressed="selectedCategory === cat ? 'true' : 'false'"
                        :aria-label="'Filter by ' + cat"
                        class="md-chip touch-target whitespace-nowrap"
                        :class="{ 'md-chip--selected': selectedCategory === cat }"
                    >
                        {{ cat }}
                    </button>
                </div>

                <!-- Grid -->
                <div v-if="filteredApps.length" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                    <div
                        v-for="app in filteredApps"
                        :key="app.id"
                        @click="launchApp(app)"
                        @keydown.enter="launchApp(app)"
                        @keydown.space.prevent="launchApp(app)"
                        role="button"
                        tabindex="0"
                        :aria-label="'Start ' + app.title + (app.url ? '' : ' (coming soon)')"
                        class="app-card p-6 sm:p-8 flex flex-col group cursor-pointer relative"
                    >
                        <div class="flex items-start justify-between mb-6">
                            <div class="p-3 rounded-2xl bg-uoa-gold text-uoa-navy transition-colors duration-300" v-html="app.icon" aria-hidden="true"></div>
                            <div class="flex flex-col items-end">
                                <span class="text-[11px] font-bold text-uoa-grey uppercase tracking-widest">{{ app.type }}</span>
                                <span v-if="app.url" class="mt-1 text-[10px] font-bold text-emerald-700 uppercase flex items-center">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-pulse"></span>
                                    Live
                                </span>
                                <span v-if="app.requiresMic" class="mt-1 text-[10px] font-bold text-red-600 uppercase flex items-center">
                                    <svg class="w-2.5 h-2.5 mr-1" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                                    Audio
                                </span>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-uoa-navy mb-2 leading-tight">{{ app.title }}</h3>
                        <p class="text-sm text-slate-600 leading-relaxed mb-6 flex-grow">{{ app.description }}</p>
                        
                        <div class="flex items-center mt-auto py-2">
                            <div class="flex items-center text-xs font-bold text-uoa-navy">
                                <span class="mr-2">Start Demo</span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                            </div>
                            <!-- Info button: stops the card's launch click and opens details -->
                            <button @click.stop="showInfo(app)" title="More info" aria-label="More info"
                                class="md-icon-btn ml-auto">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                
                <div v-else role="status" aria-live="polite" class="text-center py-20 bg-white border border-slate-200 rounded-lg">
                    <p class="text-uoa-grey font-bold uppercase tracking-widest text-sm">No demos found</p>
                    <button @click="clearFilters" class="md-btn md-btn--text touch-target mt-4">View all tools</button>
                </div>
            </main>

            <!-- Brand Footer -->
            <footer class="max-w-7xl mx-auto px-4 py-12 border-t border-slate-200 mt-10 flex flex-col items-center text-center">
                <div class="bg-uoa-navy text-white px-4 py-2 font-bold text-[10px] uppercase tracking-[0.3em] mb-4">
                    ABI Musculoskeletal Group
                </div>
                <p class="text-slate-600 text-[11px] font-bold uppercase tracking-widest">© Musculoskeletal Modelling Group, Auckland Bioengineering Institute</p>
            </footer>
        </template>

        <!-- SIMULATION VIEW -->
        <template v-else>
            <div class="min-h-screen bg-white flex flex-col">
                <nav class="bg-uoa-navy text-white p-4 flex items-center justify-between shadow-lg sticky top-0 z-40">
                    <div class="flex items-center space-x-4 lg:space-x-6">
                        <button @click="activeApp = null" class="flex items-center text-[10px] font-bold uppercase tracking-widest hover:text-uoa-gold transition-colors touch-target py-2 pr-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="m15 18-6-6 6-6"/></svg>
                            Exit
                        </button>
                        <div class="h-6 w-px bg-white/20"></div>
                        <h2 class="text-xs sm:text-sm font-bold tracking-tight uppercase truncate max-w-[150px] sm:max-w-none">{{ activeApp.title }}</h2>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-2 h-2 rounded-full bg-uoa-gold animate-pulse"></div>
                        <span class="text-[10px] font-bold tracking-widest uppercase opacity-70 hidden sm:inline">Preview</span>
                    </div>
                </nav>

                <div class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 bg-slate-50 relative overflow-hidden">
                    <div class="scanline"></div>
                    
                    <div class="max-w-3xl w-full bg-white border-t-4 border-uoa-gold shadow-2xl p-8 sm:p-12 text-center relative z-10 rounded-sm">
                        <div class="text-uoa-navy mb-6 sm:mb-8 flex justify-center" v-html="activeApp.icon.replace('24', '64')" aria-hidden="true"></div>

                        <span class="inline-block px-3 py-1 rounded-full bg-uoa-gold text-uoa-navy text-[11px] font-bold uppercase tracking-widest mb-4">
                            Coming soon
                        </span>
                        <h3 class="text-2xl sm:text-3xl font-black text-uoa-navy mb-4">{{ activeApp.title }}</h3>
                        <p class="text-uoa-grey text-sm sm:text-lg mb-8 leading-relaxed">{{ activeApp.description }}</p>

                        <!-- Sensor preview (illustrative — the live demo isn't built yet) -->
                        <div v-if="activeApp.requiresMic || activeApp.id === 5" class="mb-8 p-6 bg-slate-900 rounded shadow-inner">
                            <div class="flex justify-center items-end space-x-1 h-12 mb-4" aria-hidden="true">
                                <div v-for="i in 15" :key="i" class="wave-bar" :style="{ animationDelay: (i * 0.1) + 's' }"></div>
                            </div>
                            <p class="text-[10px] font-bold text-uoa-gold uppercase tracking-[0.2em]">
                                {{ activeApp.id === 5 ? 'Kinect motion — preview' : 'EMG sensor — preview' }}
                            </p>
                        </div>

                        <div class="bg-slate-50 border border-slate-100 p-6 rounded-sm mb-6 text-left">
                            <div class="flex justify-between text-[11px] font-bold text-uoa-navy uppercase tracking-widest mb-3">
                                <span>Status</span>
                                <span>Coming soon</span>
                            </div>
                            <p class="text-sm text-slate-600 leading-relaxed">
                                This demo is on the way — check back at the next event. Tap
                                <span class="font-bold text-uoa-navy">Exit</span> to explore the demos that are live now.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- INFO MODAL -->
        <div v-if="infoApp" class="fixed inset-0 z-50 flex items-center justify-center p-4" @click.self="closeInfo" @keydown.esc="closeInfo">
            <div class="absolute inset-0 bg-slate-900/60" @click="closeInfo"></div>
            <div role="dialog" aria-modal="true" :aria-label="infoApp.title + ' details'"
                 class="relative w-full max-w-lg p-6 sm:p-8 rounded-[28px]"
                 style="background: var(--md-sys-color-surface-container-high); box-shadow: var(--md-elevation-3);">
                <button @click="closeInfo" title="Close" aria-label="Close"
                    class="md-icon-btn absolute top-3 right-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
                <div class="flex items-center mb-4 pr-8">
                    <div class="p-3 rounded-2xl bg-uoa-gold text-uoa-navy mr-4 shrink-0" v-html="infoApp.icon"></div>
                    <div>
                        <h3 class="text-xl font-black text-uoa-navy leading-tight">{{ infoApp.title }}</h3>
                        <span class="text-[9px] font-bold text-uoa-grey uppercase tracking-widest">{{ infoApp.category }} · {{ infoApp.type }}</span>
                    </div>
                </div>
                <p class="text-sm text-slate-600 leading-relaxed mb-6">{{ infoApp.info || infoApp.description }}</p>
                <div class="flex flex-wrap items-center gap-3">
                    <span v-if="infoApp.url" class="text-[10px] font-bold text-emerald-600 uppercase flex items-center">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>Live
                    </span>
                    <span v-else class="text-[10px] font-bold text-uoa-grey uppercase">Coming soon</span>
                    <span v-if="infoApp.requiresMic" class="text-[10px] font-bold text-red-600 uppercase">Requires audio input</span>
                    <div class="ml-auto flex items-center gap-3">
                        <a v-if="infoApp.poster" :href="infoApp.poster" target="_blank" rel="noopener"
                           class="md-btn md-btn--tonal touch-target">
                            View poster
                        </a>
                        <button @click="launchFromInfo(infoApp)" class="md-btn md-btn--filled touch-target">
                            Start Demo
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        const icons = {
            waves: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>',
            activity: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
            bone: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 10c.7-.7 1.69 0 2.5 0a2.5 2.5 0 1 0 0-5c-.81 0-1.79.7-2.5 0L14 8l-3-3c-.7-.7-1.69 0-2.5 0a2.5 2.5 0 1 0 0 5c.81 0 1.79-.7 2.5 0L14 13l3 3c.7.7 1.69 0 2.5 0a2.5 2.5 0 1 1 0 5c-.81 0-1.79-.7-2.5 0L14 18l-3-3c-.7-.7-1.69 0-2.5 0a2.5 2.5 0 1 1 0-5c.81 0 1.79.7 2.5 0L11 13l-3-3z"/></svg>',
            cpu: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>',
            chart: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>',
            database: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>',
            scan: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>',
            mic: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>',
            microscope: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0-14 0"/><path d="M9 14h2"/><path d="M9 12a2 2 0 1 0-2 2V6h6v8a2 2 0 1 0-2-2"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>'
        };

        const outreachDemos = [
            {
                id: 1,
                title: 'Bone Shape Predictor',
                description: 'Predict your bone shape using Statistical Shape Models (SSM) based on sparse point clouds or clinical data.',
                info: 'Enter a few simple measurements (sex, age, height, weight and arm dimensions) and a Statistical Shape Model reconstructs a personalised 3D shoulder. You can then refine the shoulder joint angles and export a report. Runs in your browser — no install needed.',
                poster: '/posters/SSM-poster-A3.svg',
                category: 'Modelling',
                icon: icons.bone,
                color: 'text-uoa-navy',
                type: 'SSM Tool',

            },
            { 
                id: 2, 
                title: 'Muscles in Control',
                description: 'Translate EMG signals into audible sound and use your muscle activations to control a game character.',
                info: 'Plug a SpikerBox into your device\'s audio input, enable microphone access and pick the input. Calibrate by relaxing then contracting a muscle — your muscle activity then moves a bird up and down to catch the worms and dodge the cats. Needs an audio-input device.',
                poster: '/posters/EMG-poster-A3.svg',
                category: 'Biofeedback',
                icon: icons.mic,
                color: 'text-uoa-navy',
                type: 'Interactive',
                requiresMic: true,
                url: '/emg/'
            },
            { 
                id: 3, 
                title: 'Object Segmenter',
                description: 'A clinical imaging demo where you manually segment a foreign object from medical scans of the body.',
                info: 'A hands-on imaging demo: brush-paint over the foreign object hidden inside an image stack, slice by slice, then score how accurately you traced it — showing how clinicians delineate structures from imaging data.',
                poster: '/posters/Segmentation-poster-A3.svg',
                category: 'Imaging',
                url: '/segment/',
                icon: icons.microscope, 
                color: 'text-uoa-navy', 
                type: 'Segmentation' 
            },
            { 
                id: 4, 
                title: 'Surgical Navigation',
                description: 'Interactive demo showing how modelling aids surgeons in navigating complex musculoskeletal structures.',
                info: 'Shows how musculoskeletal models help surgeons navigate complex anatomy in real time during a procedure. Demo coming soon.',
                category: 'Clinical',
                icon: icons.scan, 
                color: 'text-uoa-navy', 
                type: 'Navigation' 
            },
            { 
                id: 5, 
                title: 'Kinect Motion Capture',
                description: 'Live musculoskeletal kinematics capturing your movement in real-time using Kinect sensors.',
                info: 'Uses a Kinect depth sensor to track your body and drive a live musculoskeletal model of your movement in real time. Demo coming soon.',
                category: 'Motion Capture',
                icon: icons.activity,
                color: 'text-uoa-navy',
                type: 'Live Tracking'
            },
            {
                id: 6,
                title: 'Ultrasound Imaging',
                description: 'See how ultrasound captures muscle and soft tissue in real time, and how those scans are turned into measurements.',
                info: 'Learn how ultrasound imaging visualises muscle and soft tissue in real time and how those scans are analysed. See the info sheet for details. Demo coming soon.',
                poster: '/posters/Ultrasound-poster-A3.svg',
                category: 'Imaging',
                icon: icons.waves,
                color: 'text-uoa-navy',
                type: 'Imaging'
            }
        ];

        createApp({
            setup() {
                const searchQuery = ref('');
                const selectedCategory = ref('All');
                const activeApp = ref(null);
                const infoApp = ref(null);
                const categories = ['All', 'Modelling', 'Biofeedback', 'Imaging', 'Clinical', 'Motion Capture'];

                // Hero figures cross-fade through these every few seconds.
                const heroImages = [
                    '/doc-resources/talking.png',
                    '/doc-resources/ultrasound.png',
                    '/doc-resources/video_game.png',
                    '/doc-resources/CT.png',
                    '/doc-resources/basketball.png',
                ];
                const heroIndex = ref(0);
                setInterval(() => {
                    heroIndex.value = (heroIndex.value + 1) % heroImages.length;
                }, 6000);

                const filteredApps = computed(() => {
                    return outreachDemos.filter(app => {
                        const matchesCat = selectedCategory.value === 'All' || app.category === selectedCategory.value;
                        const matchesSearch = app.title.toLowerCase().includes(searchQuery.value.toLowerCase());
                        return matchesCat && matchesSearch;
                    });
                });

                const clearFilters = () => {
                    searchQuery.value = '';
                    selectedCategory.value = 'All';
                };

                const launchApp = (app) => {
                    if (app.url) {
                        window.open(app.url, '_blank');
                    } else {
                        activeApp.value = app;
                    }
                };

                const showInfo = (app) => { infoApp.value = app; };
                const closeInfo = () => { infoApp.value = null; };
                const launchFromInfo = (app) => { closeInfo(); launchApp(app); };

                return {
                    searchQuery, selectedCategory, activeApp, infoApp, categories,
                    heroImages, heroIndex,
                    filteredApps, clearFilters, launchApp, showInfo, closeInfo, launchFromInfo,
                };
            }
        }).mount('#app');
    </script>
